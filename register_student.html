        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>


    <style>

        :root {
            --navy: #12345b;
            --blue: #1769aa;
            --sky: #edf6fc;
            --line: #d8e4ee;
            --ink: #172b4d;
            --muted: #62748a;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background: #f5f9fc;
            min-height: 100vh;
            padding: 30px 15px;
        }


        .register-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(18, 52, 91, 0.08);
            border: 1px solid var(--line);
        }


        /* ================= HEADER ================= */

        .form-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--sky);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }


        .form-header img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            flex-shrink: 0;
        }


        .form-header-text h1 {
            margin: 0;
            color: var(--navy);
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }


        .form-header-text p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }


        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 5px;
        }


        .full-width {
            grid-column: span 2;
        }


        .form-group > label {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
        }


        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fafbfc;
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            transition: 0.2s ease;
        }


        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.10);
        }


        select {
            cursor: pointer;
        }


        select:disabled {
            cursor: not-allowed;
            background: #f1f4f7;
            color: #8a98a8;
        }


        /* ================= CHECKBOX AREA ================= */

        .checkbox-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
            background: #f8fbfe;
            border: 1px solid var(--line);
            border-radius: 10px;
        }


        .checkbox-option {
            position: relative;
        }


        .checkbox-option input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }


        .checkbox-option label {
            display: flex;
            align-items: center;
            gap: 10px;

            width: 100%;
            min-height: 44px;

            margin: 0;
            padding: 10px 12px;

            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;

            color: var(--ink);
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        /* Custom checkbox */

        .checkbox-option label::before {
            content: "";

            width: 18px;
            height: 18px;
            min-width: 18px;

            border: 2px solid #b7c5d3;
            border-radius: 5px;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.2s ease;
        }


        /* Hover */

        .checkbox-option label:hover {
            border-color: var(--blue);
            background: #f4f9fd;
        }


        /* Checked */

        .checkbox-option input[type="checkbox"]:checked + label {
            background: var(--sky);
            border-color: var(--blue);
            color: var(--navy);
        }


        .checkbox-option input[type="checkbox"]:checked + label::before {
            content: "✓";
            background: var(--blue);
            border-color: var(--blue);
            color: white;
            font-size: 12px;
            font-weight: 700;
        }


        /* ================= OTHER INPUT ================= */

        .other-input {
            display: none;

            width: 100%;

            margin-top: 8px;

            padding: 12px 14px;

            border: 1px solid var(--line);
            border-radius: 8px;

            background: #ffffff;

            color: var(--ink);

            font-family: "DM Sans", sans-serif;
            font-size: 14px;
        }


        .other-input.show {
            display: block;
        }


        .other-input::placeholder {
            color: #8a9aad;
        }


        .other-input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.10);
        }


        /* ================= BUTTON ================= */

        .submit-btn {
            width: 100%;

            margin-top: 30px;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: var(--blue);
            color: #ffffff;

            font-family: "DM Sans", sans-serif;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .submit-btn:hover {
            background: #125388;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .register-wrapper {
                padding: 25px 18px;
            }


            .form-grid {
                grid-template-columns: 1fr;
            }


            .full-width {
                grid-column: span 1;
            }

                text-align: center;
            }


            .form-header-text h1 {
                font-size: 19px;
            }


            .checkbox-select {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 450px) {

            body {
                padding: 10px;
            }


            .register-wrapper {
                padding: 20px 14px;
            }


            .form-header img {
                width: 70px;
                height: 70px;
            }
        }

    </style>

</head>

<script>


/* =========================================================
   DEGREE → SUBJECT COMBINATION
========================================================= */

const degreeSelect =
    document.getElementById("degree");

const subjectSelect =
    document.getElementById("subjects");


const subjectData = {

    "biological-general": [

        ["BS1", "BS1 — Chemistry + Botany + Zoology"],

        ["BS2", "BS2 — Chemistry + Zoology + Physics"],

        ["BS3", "BS3 — Chemistry + Botany + Physics"],

        ["BS4", "BS4 — Botany + Zoology + Physics"]

    ],


    "biological-honours": [

        ["BS1", "BS1 — Chemistry + Botany + Zoology"],

        ["BS2", "BS2 — Chemistry + Zoology + Physics"],

        ["BS3", "BS3 — Chemistry + Botany + Physics"],

        ["BS4", "BS4 — Botany + Zoology + Physics"]

    ],


    "physical-general": [

        ["PS1", "PS1 — Mathematics + Industrial Mathematics + Chemistry"],

        ["PS2", "PS2 — Mathematics + Industrial Mathematics + Physics"],

        ["PS3", "PS3 — Mathematics + Chemistry + Physics"],

        ["PS4", "PS4 — Mathematics + Applied Mathematics + Chemistry"],

        ["PS5", "PS5 — Mathematics + Applied Mathematics + Physics"],

        ["PS6", "PS6 — Mathematics + Applied Mathematics + Computer Science"],

        ["PS7", "PS7 — Mathematics + Physics + Computer Science"],

        ["PS8", "PS8 — Mathematics + Chemistry + Computer Science"]

    ],


    "physical-honours": [

        ["PS1", "PS1 — Mathematics + Industrial Mathematics + Chemistry"],

        ["PS2", "PS2 — Mathematics + Industrial Mathematics + Physics"],

        ["PS3", "PS3 — Mathematics + Chemistry + Physics"],

        ["PS4", "PS4 — Mathematics + Applied Mathematics + Chemistry"],

        ["PS5", "PS5 — Mathematics + Applied Mathematics + Physics"],

        ["PS6", "PS6 — Mathematics + Applied Mathematics + Computer Science"],

        ["PS7", "PS7 — Mathematics + Physics + Computer Science"],

        ["PS8", "PS8 — Mathematics + Chemistry + Computer Science"]

    ]

};


degreeSelect.addEventListener("change", function () {

    const selectedDegree = this.value;


    subjectSelect.innerHTML = "";


    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        "-- Select Subject Combination --";

    subjectSelect.appendChild(defaultOption);


    if (
        subjectData[selectedDegree] &&
        subjectData[selectedDegree].length > 0
    ) {

        subjectData[selectedDegree].forEach(function (subject) {

            const option =
                document.createElement("option");

            option.value = subject[0];

            option.textContent = subject[1];

            subjectSelect.appendChild(option);

        });


        subjectSelect.disabled = false;

    }

    else {

        subjectSelect.disabled = true;

    }

});



/* =========================================================
   CHECKBOX OTHER
========================================================= */

const checkboxOtherPairs = [

    ["career18", "other_career_interests"],

    ["tech19", "other_tech_skills"],

    ["soft14", "other_soft_skills"],

    ["software18", "other_software_skills"],

    ["lang10", "other_languages"]

];


checkboxOtherPairs.forEach(function (pair) {

    const checkbox =
        document.getElementById(pair[0]);

    const input =
        document.getElementById(pair[1]);


    if (!checkbox || !input) {
        return;
    }


    checkbox.addEventListener("change", function () {

        if (this.checked) {

            input.classList.add("show");

            input.focus();

        }

        else {

            input.classList.remove("show");

            input.value = "";

        }

    });

});



/* =========================================================
   SELECT OTHER
========================================================= */

const selectOtherPairs = [

    ["internship", "other_internship"],

    ["experience", "other_experience"],

    ["leadership", "other_leadership"],

    ["preferences", "other_preferences"],

    ["job_status", "other_job_status"]

];


selectOtherPairs.forEach(function (pair) {

    const select =
        document.getElementById(pair[0]);

    const input =
        document.getElementById(pair[1]);


    if (!select || !input) {
        return;
    }


    function checkOther() {

        if (select.value === "Other") {

            input.classList.add("show");

        }

        else {

            input.classList.remove("show");

            input.value = "";

        }

    }


    select.addEventListener(
        "change",
        checkOther
    );


    checkOther();

});


</script>
